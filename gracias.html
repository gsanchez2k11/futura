<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mensaje enviado · Futura Teck</title>
    <style>
        :root {
            --pink: #e6007e;
            --dark: #111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
        }

        .check {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(230, 0, 126, .1);
            color: var(--pink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        h1 { font-size: 1.6rem; margin-bottom: 12px; }

        p { color: #555; line-height: 1.6; margin-bottom: 28px; }

        .btn {
            display: inline-block;
            background: var(--pink);
            color: #fff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity .2s;
        }

        .btn:hover { opacity: .9; }
    </style>
</head>

<body>
    <main class="card">
        <div class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
                <path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <h1>¡Mensaje enviado!</h1>
        <p>Gracias por contactar con Futura Teck. Hemos recibido tu consulta y te
            responderemos en menos de 24h laborables. Revisa tu correo: te hemos
            enviado una confirmación.</p>
        <a class="btn" href="index.html">← Volver al inicio</a>
    </main>
</body>

</html>
